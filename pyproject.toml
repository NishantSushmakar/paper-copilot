[project]
name = "paper-copilot"
version = "0.1.0"
description = "An agentic research assistant built from scratch on local open-weight models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.45",
    "sentence-transformers>=3.0",
    "datasets>=3.0",
    # Tracing: OpenTelemetry exporter pointed at the self-hosted Phoenix server
    "arize-phoenix-otel>=0.6",
    "langchain-openai>=1.7.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "langsmith>=0.14.12",
    "diskcache>=5.6.3",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.21.4",
]

[project.optional-dependencies]
# Added when A3 (retrieval) starts
retrieval = [
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
]
plot = [
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copilot*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
